[project]
name = "openai-realtime-voice-chat"
version = "0.1.0"
description = "Real-time voice chat using Next.js frontend and FastAPI backend with OpenAI's Realtime API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.139.0",
    "uvicorn[standard]~=0.50.0",
    "websockets~=16.0",
    "openai~=2.44.0",
    "numpy~=2.5.0",
    "av~=17.0.0",
    "pyyaml~=6.0",
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=7.4",
    "pytest-asyncio~=0.21",
    "httpx~=0.24",
]
