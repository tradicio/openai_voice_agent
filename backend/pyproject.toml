[project]
name = "openai-realtime-voice-chat-backend"
version = "0.1.0"
description = "FastAPI backend for OpenAI Realtime Voice Chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.100",
    "uvicorn[standard]~=0.24",
    "websockets~=14.1",
    "openai~=1.55",
    "numpy~=2.1",
    "av~=12.3",
    "pyyaml~=6.0",
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=7.4",
    "pytest-asyncio~=0.21",
    "httpx~=0.24",
]
